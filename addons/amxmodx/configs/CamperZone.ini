#==============================================#
# Camper Zone by RedSMURF: Configuration file #
#==============================================#

# To add a new camper zone, follow the example below
# [Camper Zone Name]
# CAMPER_FLAGS                      = a - Active Delay      b - Active Duration     c - Warning Slap,       d - Warning Message     e - Damage Slap
# CAMPER_TEAM                       = 0 - None              1 - Terrorist           2 - Counter-Terrorist   3 - Both

# CAMPER_DAMAGE                     = Amount of damage to deal to campers per tick
# CAMPER_DAMAGE_TICK                = Delay in seconds between each damage tick
# CAMPER_DAMAGE_DELAY               = Delay before camper damage starts.
# CAMPER_DAMAGE_RESET_DELAY         = Delay before camper damage resets.
# CAMPER_DAMAGE_MULTIPLIER_DELAY    = Seconds after camper damage starts before the multiplier is applied
# CAMPER_DAMAGE_MULTIPLIER          = Damage multiplier added after the multiplier delay
# CAMPER_WARNING_DELAY              = Delay in seconds before the camper zone warning starts.
# CAMPER_WARNING_COOLDOWN           = Delay in seconds before the camper zone warning can be triggered again.
# CAMPER_WARNING_MESSAGE            = Message to display to campers when they enter the zone

# CAMPER_ACTIVE_CHANCE              = Camper zone's activation probability (0.0 = never, 1.0 = always)
# CAMPER_ACTIVE_DELAY               = Delay in seconds before the camper zone becomes active at round start
# CAMPER_ACTIVE_DURATION            = Duration of the active state in seconds
# CAMPER_ACTIVE_COOLDOWN            = Cooldown in seconds before the camper zone becomes active again

